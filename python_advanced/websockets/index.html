<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>WebSocket Client</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1><span id="statusDot" class="status"></span>WebSocket Client</h1>
            <div id="log"></div>
            <form id="form">
                <textarea id="textzone" placeholder="Type a message..." autofocus></textarea>
                <button type="submit" id="sendBtn" disabled>Send</button>
            </form>
        </main>

        <script src="client.js"></script>
    </body>
</html>
